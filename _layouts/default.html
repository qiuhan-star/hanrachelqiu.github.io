---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ page.lang | default: site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S0DGZJKVH1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-S0DGZJKVH1');
    </script>

    <style>
      /* ===== 站点开屏动画（每次刷新都播放）===== */
      .preloader {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        background:
          radial-gradient(620px 420px at 18% 22%, rgba(79,124,255,0.07), transparent 62%),
          radial-gradient(720px 520px at 84% 78%, rgba(168,128,255,0.07), transparent 62%),
          linear-gradient(180deg, #fbfbfe, #f2f4fb);
        z-index: 9999;
        overflow: hidden;
        transition: transform 0.95s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.95s ease;
      }
      .preloader.show { display: flex; }
      .preloader.hide { transform: translateY(-100%); opacity: 0.9; pointer-events: none; }
      .preloader-glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.55;
        pointer-events: none;
        animation: hqBreathe 26s ease-in-out infinite;
      }
      .preloader-glow.g1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax;
        background: radial-gradient(circle, rgba(79,124,255,0.16), transparent 68%); }
      .preloader-glow.g2 { width: 40vmax; height: 40vmax; right: -10vmax; bottom: -12vmax;
        background: radial-gradient(circle, rgba(168,128,255,0.14), transparent 68%); animation-delay: -13s; }
      @keyframes hqBreathe {
        0%, 100% { transform: scale(1) translate(0, 0); }
        50%      { transform: scale(1.14) translate(2vmax, -1.5vmax); }
      }
      /* 几只在画面中缓缓飘动的小蝴蝶（克制、低饱和，不刻意从底部飞出） */
      .butterflies { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
      .bf { position: absolute; opacity: 0; }
      .bf svg { width: 100%; height: 100%; display: block; }
      .bf .wings { transform-origin: 50% 50%; animation: hqFlap 0.45s ease-in-out infinite; }
      @keyframes hqFlap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.45); } }
      .bf1 { left: 12%; top: 24%; width: 60px; height: 60px; color: rgba(125,155,255,0.8);  animation: hqFly1 23s ease-in-out infinite; }
      .bf2 { left: 30%; top: 40%; width: 50px; height: 50px; color: rgba(185,167,255,0.8); animation: hqFly2 27s ease-in-out infinite; animation-delay: -6s; }
      .bf3 { left: 52%; top: 18%; width: 54px; height: 54px; color: rgba(255,170,200,0.72);animation: hqFly3 31s ease-in-out infinite; animation-delay: -12s; }
      .bf4 { left: 70%; top: 36%; width: 44px; height: 44px; color: rgba(150,205,195,0.72);animation: hqFly4 25s ease-in-out infinite; animation-delay: -18s; }
      @keyframes hqFly1 {
        0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
        12%  { opacity: .65; }
        35%  { transform: translate(8vw,-10vh) rotate(10deg); }
        60%  { transform: translate(-4vw,-20vh) rotate(-8deg); }
        85%  { opacity: .65; }
        100% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      }
      @keyframes hqFly2 {
        0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
        12%  { opacity: .65; }
        35%  { transform: translate(-9vw,-8vh) rotate(-10deg); }
        60%  { transform: translate(5vw,-18vh) rotate(8deg); }
        85%  { opacity: .65; }
        100% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      }
      @keyframes hqFly3 {
        0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
        12%  { opacity: .6; }
        35%  { transform: translate(7vw,-12vh) rotate(8deg); }
        60%  { transform: translate(-6vw,-22vh) rotate(-9deg); }
        85%  { opacity: .6; }
        100% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      }
      @keyframes hqFly4 {
        0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
        12%  { opacity: .6; }
        35%  { transform: translate(-7vw,-9vh) rotate(-8deg); }
        60%  { transform: translate(4vw,-19vh) rotate(9deg); }
        85%  { opacity: .6; }
        100% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      }
      /* 下滑进入提示（无边框，克制） */
      .enter-hint {
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        color: #5b6472; font-size: 0.82rem; letter-spacing: 0.12em;
        opacity: 0; z-index: 2;
        animation: hqHintIn 0.8s ease 2.6s forwards, hqFloatY 2.4s ease-in-out 3.4s infinite;
      }
      @keyframes hqHintIn { to { opacity: 1; } }
      @keyframes hqFloatY { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 6px); } }
      .ml13 {
        font-size: clamp(2.2rem, 8.5vw, 4.4rem);
        font-weight: 650;
        letter-spacing: -1px;
        color: #14161c;
        text-align: center;
        line-height: 1.12;
        max-width: 92vw;
        position: relative;
        z-index: 2;
      }
      .ml13 .word { display: inline-flex; white-space: nowrap; }
      .ml13 .letter {
        display: inline-block;
        opacity: 0;
        transform: translateY(115%);
        filter: blur(10px);
        animation: hqLetterIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes hqLetterIn {
        0%   { transform: translateY(115%); opacity: 0; filter: blur(10px); }
        100% { transform: translateY(0);    opacity: 1; filter: blur(0); }
      }
      .preloader-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, #5b6472, transparent);
        width: 0;
        opacity: 0.5;
        position: relative;
        z-index: 2;
        animation: hqDivider 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.35s forwards;
      }
      @keyframes hqDivider {
        from { width: 0; }
        to   { width: min(320px, 52vw); }
      }
      .preloader-tagline {
        font-size: clamp(0.9rem, 2.6vw, 1.1rem);
        letter-spacing: 0.18em;
        color: #5b6472;
        opacity: 0;
        transform: translateY(10px);
        animation: hqTagline 0.9s ease 1.1s forwards;
        position: relative;
        z-index: 2;
        text-transform: uppercase;
      }
      @keyframes hqTagline { to { opacity: 1; transform: translateY(0); } }
      @media (prefers-color-scheme: dark) {
        .preloader {
          background:
            radial-gradient(620px 420px at 18% 22%, rgba(124,155,255,0.10), transparent 62%),
            radial-gradient(720px 520px at 84% 78%, rgba(168,128,255,0.09), transparent 62%),
            linear-gradient(180deg, #13151a, #1a1d25);
        }
        .ml13 { color: #f2f3f5; }
        .preloader-divider { background: linear-gradient(90deg, transparent, #9aa3b2, transparent); }
        .preloader-tagline { color: #9aa3b2; }
        .enter-hint { color: #9aa3b2; }
      }

      /* 暗色模式开关：固定在顶栏右上方，始终位于开屏层之上 */
      body > .theme-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10000;
        margin: 0;
        padding: 0;
      }
      /* 手动切换暗色时，开屏页也跟随变暗 */
      body.dark .preloader {
        background:
          radial-gradient(620px 420px at 18% 22%, rgba(124,155,255,0.10), transparent 62%),
          radial-gradient(720px 520px at 84% 78%, rgba(168,128,255,0.09), transparent 62%),
          linear-gradient(180deg, #13151a, #1a1d25);
      }
      body.dark .ml13 { color: #f2f3f5; }
      body.dark .preloader-divider { background: linear-gradient(90deg, transparent, #9aa3b2, transparent); }
      body.dark .preloader-tagline { color: #9aa3b2; }
      body.dark .enter-hint { color: #9aa3b2; }
    </style>
  </head>

  <body>

    <div class="theme-toggle" aria-label="Toggle dark mode">
      <input type="checkbox" class="checkbox" id="checkbox">
      <label for="checkbox" class="checkbox-label" aria-label="Toggle dark mode" title="Toggle dark mode">
        <i class="fas fa-moon" aria-hidden="true"></i>
        <i class="fas fa-sun" aria-hidden="true"></i>
        <span class="ball"></span>
      </label>
    </div>

    <div class="preloader" id="preloader" aria-hidden="true">
      <div class="preloader-glow g1"></div>
      <div class="preloader-glow g2"></div>
      <div class="butterflies" aria-hidden="true">
        <span class="bf bf1"><svg viewBox="0 0 64 64"><g class="wings" fill="currentColor"><path d="M32 30C24 6 2 8 8 28c3 10 18 8 24 2Z"/><path d="M32 30c8-24 30-22 24-2-3 10-18 8-24 2Z"/><path d="M32 31c-6 5-18 9-14 19 4 8 12-6 14-19Z"/><path d="M32 31c6 5 18 9 14 19-4 8-12-6-14-19Z"/></g><rect x="31" y="14" width="2" height="34" rx="1" fill="currentColor"/></svg></span>
        <span class="bf bf2"><svg viewBox="0 0 64 64"><g class="wings" fill="currentColor"><path d="M32 30C24 6 2 8 8 28c3 10 18 8 24 2Z"/><path d="M32 30c8-24 30-22 24-2-3 10-18 8-24 2Z"/><path d="M32 31c-6 5-18 9-14 19 4 8 12-6 14-19Z"/><path d="M32 31c6 5 18 9 14 19-4 8-12-6-14-19Z"/></g><rect x="31" y="14" width="2" height="34" rx="1" fill="currentColor"/></svg></span>
        <span class="bf bf3"><svg viewBox="0 0 64 64"><g class="wings" fill="currentColor"><path d="M32 30C24 6 2 8 8 28c3 10 18 8 24 2Z"/><path d="M32 30c8-24 30-22 24-2-3 10-18 8-24 2Z"/><path d="M32 31c-6 5-18 9-14 19 4 8 12-6 14-19Z"/><path d="M32 31c6 5 18 9 14 19-4 8-12-6-14-19Z"/></g><rect x="31" y="14" width="2" height="34" rx="1" fill="currentColor"/></svg></span>
        <span class="bf bf4"><svg viewBox="0 0 64 64"><g class="wings" fill="currentColor"><path d="M32 30C24 6 2 8 8 28c3 10 18 8 24 2Z"/><path d="M32 30c8-24 30-22 24-2-3 10-18 8-24 2Z"/><path d="M32 31c-6 5-18 9-14 19 4 8 12-6 14-19Z"/><path d="M32 31c6 5 18 9 14 19-4 8-12-6-14-19Z"/></g><rect x="31" y="14" width="2" height="34" rx="1" fill="currentColor"/></svg></span>
      </div>
      <h1 class="ml13" id="ml13"></h1>
      <div class="preloader-divider"></div>
      <div class="preloader-tagline">思接星海，行落人间</div>
      <div class="enter-hint" aria-hidden="true">
        <span>下滑进入</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      </div>
    </div>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

    <script>
      /* ===== 站点开屏动画（每次刷新都播放）===== */
      (function () {
        var PRELOADER_TEXT = "Han (Rachel) Qiu";
        var CURTAIN_MS = 950, HARD_CAP_MS = 15000;

        var preloader = document.getElementById('preloader');
        if (!preloader) return;
        preloader.classList.add('show');

        /* 拆词 -> 字母，错峰入场 */
        var wrap = document.getElementById('ml13');
        var words = PRELOADER_TEXT.trim().split(/\s+/);
        var idx = 0;
        words.forEach(function (word, w) {
          var wSpan = document.createElement('span');
          wSpan.className = 'word';
          word.split('').forEach(function (ch) {
            var l = document.createElement('span');
            l.className = 'letter';
            l.textContent = ch;
            l.style.animationDelay = (idx * 0.055) + 's';
            wSpan.appendChild(l);
            idx++;
          });
          wrap.appendChild(wSpan);
          if (w < words.length - 1) wrap.appendChild(document.createTextNode(' '));
        });

        /* 播放期间锁定滚动，避免看到动画层后面的内容在动 */
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';

        var done = false;
        function enterSite() {
          if (done) return;
          done = true;
          preloader.classList.add('hide');
          setTimeout(function () {
            preloader.style.display = 'none';
            document.documentElement.style.overflow = '';
            document.body.style.overflow = '';
          }, CURTAIN_MS);
        }

        /* 下滑 / 手势进入主页（不再自动跳走，停留由访客掌控） */
        function onIntent(e) {
          var down = false;
          if (e.type === 'wheel') down = e.deltaY > 0;
          else if (e.type === 'keydown') down = (e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter');
          if (down) enterSite();
        }
        window.addEventListener('wheel', onIntent, { passive: true });
        window.addEventListener('keydown', onIntent);
        var tStartY = null;
        window.addEventListener('touchstart', function (e) { tStartY = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchmove', function (e) {
          if (tStartY !== null && e.touches[0].clientY < tStartY - 40) enterSite();
        }, { passive: true });

        setTimeout(enterSite, HARD_CAP_MS); /* 兜底：15 秒后自动进入 */
      })();
    </script>

    <script type="text/javascript">
      const checkbox = document.getElementById("checkbox");
      checkbox.addEventListener("change", () => {
        document.body.classList.toggle("dark");
      });
    </script>

  </body>
</html>
