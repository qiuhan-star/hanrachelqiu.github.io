    <style>
      /* ===== 站点开屏动画（每次刷新都播放）===== */
      .preloader {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        background:
          radial-gradient(620px 420px at 18% 22%, rgba(79,124,255,0.07), transparent 62%),
          radial-gradient(720px 520px at 84% 78%, rgba(168,128,255,0.07), transparent 62%),
          linear-gradient(180deg, #fbfbfe, #f2f4fb);
        z-index: 9999;
        overflow: hidden;
        transition: transform 0.95s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.95s ease;
      }
      .preloader.show { display: flex; }
      .preloader.hide { transform: translateY(-100%); opacity: 0.9; pointer-events: none; }
      .preloader-glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.55;
        pointer-events: none;
        animation: hqBreathe 26s ease-in-out infinite;
      }
      .preloader-glow.g1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax;
        background: radial-gradient(circle, rgba(79,124,255,0.16), transparent 68%); }
      .preloader-glow.g2 { width: 40vmax; height: 40vmax; right: -10vmax; bottom: -12vmax;
        background: radial-gradient(circle, rgba(168,128,255,0.14), transparent 68%); animation-delay: -13s; }
      @keyframes hqBreathe {
        0%, 100% { transform: scale(1) translate(0, 0); }
        50%      { transform: scale(1.14) translate(2vmax, -1.5vmax); }
      }
      /* 几只在画面中缓缓飘动的小蝴蝶（克制、低饱和，不刻意从底部飞出） */
      .butterflies { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
      .bf { position: absolute; opacity: 0; }
      .bf svg { width: 100%; height: 100%; display: block; }
      .bf .wings { transform-origin: 50% 50%; animation: hqFlap 0.45s ease-in-out infinite; }
      @keyframes hqFlap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.45); } }
      .bf1 { left: 12%; top: 24%; width: 60px; height: 60px; color: rgba(125,155,255,0.8);  animation: hqFly1 23s ease-in-out infinite; }
      .bf2 { left: 30%; top: 40%; width: 50px; height: 50px; color: rgba(185,167,255,0.8); animation: hqFly2 27s ease-in-out infinite; animation-delay: -6s; }
      .bf3 { left: 52%; top: 18%; width: 54px; height: 54px; color: rgba(255,170,200,0.72);animation: hqFly3 31s ease-in-out infinite; animation-delay: -12s; }
      .bf4 { left: 70%; top: 36%; width: 44px; height: 44px; color: rgba(150,205,195,0.72);animation: hqFly4 25s ease-in-out infinite; animation-delay: -18s; }
      @keyframes hqFly1 {
        0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
        12%  { opacity: .65; }
        35%  { transform: translate(8vw,-10vh) rotate(10deg); }
        60%  { transform: translate(-4vw,-20vh) rotate(-8deg); }
        85%  { opacity: .65; }
        100% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      }
      @keyframes hqFly2 {
        0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
        12%  { opacity: .65; }
        35%  { transform: translate(-9vw,-8vh) rotate(-10deg); }
        60%  { transform: translate(5vw,-18vh) rotate(8deg); }
        85%  { opacity: .65; }
        100% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      }
      @keyframes hqFly3 {
        0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
        12%  { opacity: .6; }
        35%  { transform: translate(7vw,-12vh) rotate(8deg); }
        60%  { transform: translate(-6vw,-22vh) rotate(-9deg); }
        85%  { opacity: .6; }
        100% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      }
      @keyframes hqFly4 {
        0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
        12%  { opacity: .6; }
        35%  { transform: translate(-7vw,-9vh) rotate(-8deg); }
        60%  { transform: translate(4vw,-19vh) rotate(9deg); }
        85%  { opacity: .6; }
        100% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      }
      /* 下滑进入提示（无边框，克制） */
      .enter-hint {
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        color: #5b6472; font-size: 0.82rem; letter-spacing: 0.12em;
        opacity: 0; z-index: 2;
        animation: hqHintIn 0.8s ease 2.6s forwards, hqFloatY 2.4s ease-in-out 3.4s infinite;
      }
      @keyframes hqHintIn { to { opacity: 1; } }
      @keyframes hqFloatY { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 6px); } }
      .ml13 {
        font-size: clamp(2.2rem, 8.5vw, 4.4rem);
        font-weight: 650;
        letter-spacing: -1px;
        color: #14161c;
        text-align: center;
        line-height: 1.12;
        max-width: 92vw;
        position: relative;
        z-index: 2;
      }
      .ml13 .word { display: inline-flex; white-space: nowrap; }
      .ml13 .letter {
        display: inline-block;
        opacity: 0;
        transform: translateY(115%);
        filter: blur(10px);
        animation: hqLetterIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes hqLetterIn {
        0%   { transform: translateY(115%); opacity: 0; filter: blur(10px); }
        100% { transform: translateY(0);    opacity: 1; filter: blur(0); }
      }
      .preloader-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, #5b6472, transparent);
        width: 0;
        opacity: 0.5;
        position: relative;
        z-index: 2;
        animation: hqDivider 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.35s forwards;
      }
      @keyframes hqDivider {
        from { width: 0; }
        to   { width: min(320px, 52vw); }
      }
      .preloader-tagline {
        font-size: clamp(0.9rem, 2.6vw, 1.1rem);
        letter-spacing: 0.18em;
        color: #5b6472;
        opacity: 0;
        transform: translateY(10px);
        animation: hqTagline 0.9s ease 1.1s forwards;
        position: relative;
        z-index: 2;
        text-transform: uppercase;
      }
      @keyframes hqTagline { to { opacity: 1; transform: translateY(0); } }
      @media (prefers-color-scheme: dark) {
        .preloader {
          background:
            radial-gradient(620px 420px at 18% 22%, rgba(124,155,255,0.10), transparent 62%),
            radial-gradient(720px 520px at 84% 78%, rgba(168,128,255,0.09), transparent 62%),
            linear-gradient(180deg, #13151a, #1a1d25);
        }
        .ml13 { color: #f2f3f5; }
        .preloader-divider { background: linear-gradient(90deg, transparent, #9aa3b2, transparent); }
        .preloader-tagline { color: #9aa3b2; }
        .enter-hint { color: #9aa3b2; }
      }

      /* 暗色模式开关：固定在顶栏右上方，始终位于开屏层之上 */
      body > .theme-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10000;
        margin: 0;
        padding: 0;
      }
      /* 手动切换暗色时，开屏页也跟随变暗 */
      body.dark .preloader {
        background:
          radial-gradient(620px 420px at 18% 22%, rgba(124,155,255,0.10), transparent 62%),
          radial-gradient(720px 520px at 84% 78%, rgba(168,128,255,0.09), transparent 62%),
          linear-gradient(180deg, #13151a, #1a1d25);
      }
      body.dark .ml13 { color: #f2f3f5; }
      body.dark .preloader-divider { background: linear-gradient(90deg, transparent, #9aa3b2, transparent); }
      body.dark .preloader-tagline { color: #9aa3b2; }
      body.dark .enter-hint { color: #9aa3b2; }

      /* ===== 亮/暗切换按钮（al-folio 同款三态：跟随系统 → 亮 → 暗）===== */
      /* 全站渐变过渡：切换主题时所有元素在 750ms 内平滑变亮 / 变暗 */
      html.transition,
      html.transition *,
      html.transition *::before,
      html.transition *::after {
        transition: all 750ms !important;
        transition-delay: 0 !important;
      }

      /* 按钮外观 */
      .theme-toggle {
        background: transparent;
        border: 0;
        cursor: pointer;
        color: #4a4a4a;
        font-size: 1.3rem;
        line-height: 1;
        padding: 4px 6px;
        border-radius: 8px;
        pointer-events: auto;
        transition: transform 150ms ease, color 150ms ease;
      }
      .theme-toggle:active { transform: scale(0.86); }
      .theme-toggle:hover { color: #000; }
      body.dark .theme-toggle { color: #cfcfcf; }
      body.dark .theme-toggle:hover { color: #fff; }

      /* 三个 icon 按当前模式显示其一 */
      #light-toggle-system { display: block; }
      #light-toggle-dark { display: none; }
      #light-toggle-light { display: none; }
      html[data-theme-setting="dark"] #light-toggle-system { display: none; }
      html[data-theme-setting="dark"] #light-toggle-dark { display: block; }
      html[data-theme-setting="dark"] #light-toggle-light { display: none; }
      html[data-theme-setting="light"] #light-toggle-system { display: none; }
      html[data-theme-setting="light"] #light-toggle-dark { display: none; }
      html[data-theme-setting="light"] #light-toggle-light { display: block; }
    </style>

    <script>
      /* 首屏前计算主题，避免闪屏（system = 跟随系统） */
      (function () {
        var s = null;
        try { s = localStorage.getItem('theme'); } catch (e) { s = null; }
        var order = ['system', 'light', 'dark'];
        if (order.indexOf(s) < 0) s = 'system';
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (s === 'system') ? (dark ? 'dark' : 'light') : s;
        document.documentElement.setAttribute('data-theme-setting', s);
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>

    <script>
      /* ===== 站点开屏动画：刷新/首次访问/站外进入播放，站内链接跳转不播放；蝴蝶代码不变 ===== */
      (function () {
        var PRELOADER_TEXT = "Han (Rachel) Qiu";
        var CURTAIN_MS = 950, HARD_CAP_MS = 15000;

        var preloader = document.getElementById('preloader');
        if (!preloader) return;

        /* 标记站内跳转：点击任意同域站内链接时写标记，用以在下一页跳过开屏动画。
           这样「点标题回首页」与「点 Publications 等」行为一致——都不重播。
           刷新(F5/cmd+R)、首次访问、直输网址、站外进入都不会设置此标记，因此会正常播放。
           （刻意不用 referrer / Navigation Timing 判定——它们在本站点会误判刷新为"站内跳转"） */
        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest ? e.target.closest('a') : null;
          if (!a) return;
          var href = a.getAttribute('href') || '';
          if (href.charAt(0) === '#' || a.target === '_blank' || a.hasAttribute('download')) return;
          try {
            var url = new URL(a.href, location.href);
            if (url.origin === location.origin) {
              sessionStorage.setItem('hq-internal-nav', '1');
              /* 若这次点击没有真正跨文档导航（同页锚点 / 被拦截），1s 后自动清除，避免污染后续刷新 */
              setTimeout(function () {
                try { sessionStorage.removeItem('hq-internal-nav'); } catch (err) {}
              }, 1000);
            }
          } catch (err) {}
        });

        /* 是否跳过开屏动画：仅当本次加载是由「点击站内链接跳转」触发（上一页已写标记）时才跳过；
           其余情况（刷新/首次访问/直输网址/站外进入）一律播放。 */
        var skip = false;
        try {
          if (sessionStorage.getItem('hq-internal-nav') === '1') {
            sessionStorage.removeItem('hq-internal-nav');
            skip = true;
          }
        } catch (e) {}

        if (skip) {
          preloader.style.display = 'none';
          return;
        }

        preloader.classList.add('show');

        /* 拆词 -> 字母，错峰入场 */
        var wrap = document.getElementById('ml13');
        var words = PRELOADER_TEXT.trim().split(/\s+/);
        var idx = 0;
        words.forEach(function (word, w) {
          var wSpan = document.createElement('span');
          wSpan.className = 'word';
          word.split('').forEach(function (ch) {
            var l = document.createElement('span');
            l.className = 'letter';
            l.textContent = ch;
            l.style.animationDelay = (idx * 0.055) + 's';
            wSpan.appendChild(l);
            idx++;
          });
          wrap.appendChild(wSpan);
          if (w < words.length - 1) wrap.appendChild(document.createTextNode(' '));
        });

        /* 播放期间锁定滚动，避免看到动画层后面的内容在动 */
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';

        var done = false;
        function enterSite() {
          if (done) return;
          done = true;
          preloader.classList.add('hide');
          setTimeout(function () {
            preloader.style.display = 'none';
            document.documentElement.style.overflow = '';
            document.body.style.overflow = '';
          }, CURTAIN_MS);
        }

        /* 下滑 / 手势进入主页（不再自动跳走，停留由访客掌控） */
        function onIntent(e) {
          var down = false;
          if (e.type === 'wheel') down = e.deltaY > 0;
          else if (e.type === 'keydown') down = (e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter');
          if (down) enterSite();
        }
        window.addEventListener('wheel', onIntent, { passive: true });
        window.addEventListener('keydown', onIntent);
        var tStartY = null;
        window.addEventListener('touchstart', function (e) { tStartY = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchmove', function (e) {
          if (tStartY !== null && e.touches[0].clientY < tStartY - 40) enterSite();
        }, { passive: true });

        setTimeout(enterSite, HARD_CAP_MS); /* 兜底：15 秒后自动进入 */
      })();
    </script>

    <script type="text/javascript">
      /* ===== 亮/暗切换：跟随系统 → 亮 → 暗 三态循环，icon 随状态变化 ===== */
      (function () {
        var SETTINGS = ['system', 'light', 'dark'];
        // localStorage 容错：隐私模式 / 禁用时退回内存变量，按钮仍然可用
        var _memTheme = null;
        function readTheme() {
          try { return localStorage.getItem('theme'); } catch (e) { return _memTheme; }
        }
        function writeTheme(v) {
          _memTheme = v;
          try { localStorage.setItem('theme', v); } catch (e) {}
        }
        function getSetting() {
          var t = readTheme();
          return SETTINGS.indexOf(t) >= 0 ? t : 'system';
        }
        function compute(setting) {
          if (setting === 'system') {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          return setting;
        }
        // 关键：下一次点击一定切到「与当前外观相反」的状态，保证每次点击都有可见变化
        function nextSetting(cur) {
          var i = SETTINGS.indexOf(cur);
          var curResolved = compute(cur);
          for (var k = 1; k < SETTINGS.length; k++) {
            var cand = SETTINGS[(i + k) % SETTINGS.length];
            if (compute(cand) !== curResolved) return cand;
          }
          return SETTINGS[(i + 1) % SETTINGS.length];
        }
        function apply(setting, withTransition) {
          var theme = compute(setting);
          var html = document.documentElement;
          html.setAttribute('data-theme-setting', setting);
          html.setAttribute('data-theme', theme);
          document.body.classList.toggle('dark', theme === 'dark');
          if (withTransition) {
            html.classList.add('transition');
            setTimeout(function () { html.classList.remove('transition'); }, 800);
          }
        }
        var btn = document.getElementById('light-toggle');
        if (btn) {
          btn.addEventListener('click', function () {
            var next = nextSetting(getSetting());
            writeTheme(next);
            apply(next, true);
          });
          // 处于「跟随系统」时，系统主题变了也实时跟随
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            if (getSetting() === 'system') apply('system', true);
          });
        }
      })();
    </script>

  </body>
</html>
