<style>
.talk-gallery { display:flex; gap:12px; overflow-x:auto; padding:4px 0 12px; scroll-snap-type:x mandatory; scrollbar-width:thin; -webkit-overflow-scrolling:touch; margin:16px 0; }
.talk-gallery::-webkit-scrollbar { height:6px; }
.talk-gallery::-webkit-scrollbar-track { background:transparent; }
.talk-gallery::-webkit-scrollbar-thumb { background:#d2d2d7; border-radius:3px; }
.talk-gallery .gallery-item { min-width:300px; height:200px; border-radius:10px; overflow:hidden; border:1px solid rgba(0,0,0,.08); flex-shrink:0; scroll-snap-align:start; cursor:pointer; background:#fff; }
.talk-gallery .gallery-item img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; user-select:none; -webkit-touch-callout:none; }
.talk-gallery .gallery-item:hover { box-shadow:0 4px 16px rgba(0,0,0,.12); }
.talk-gallery-caption { font-size:.82rem; color:var(--text-secondary); margin:4px 0 0; }
.talk-gallery-modal { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.9); cursor:pointer; align-items:center; justify-content:center; }
.talk-gallery-modal.open { display:flex; }
.talk-gallery-modal img { max-width:90vw; max-height:90vh; object-fit:contain; border-radius:4px; pointer-events:none; user-select:none; -webkit-touch-callout:none; }
.talk-gallery-close { position:absolute; top:20px; right:28px; color:#fff; font-size:36px; font-weight:300; cursor:pointer; line-height:1; opacity:.7; }
.talk-gallery-close:hover { opacity:1; }
</style>
<div class="talk-gallery" id="gallery-{{ include.id }}" oncontextmenu="return false;">
  {% for i in (1..include.count) %}
    {% assign ext = include.ext | default: '.JPG' %}
    <div class="gallery-item" onclick="openGalleryModal('{{ site.url }}/images/talks/{{ include.prefix }}-{{ i }}{{ ext }}')">
      <img src="{{ site.url }}/images/talks/{{ include.prefix }}-{{ i }}{{ ext }}" alt="{{ include.label }} {{ i }}" loading="lazy" draggable="false">
    </div>
  {% endfor %}
</div>
<div class="talk-gallery-modal" id="galleryModal" onclick="closeGalleryModal(event)">
  <span class="talk-gallery-close">&times;</span>
  <img id="galleryModalImg" src="" draggable="false">
</div>
<script>
function openGalleryModal(src){ document.getElementById('galleryModal').classList.add('open'); document.getElementById('galleryModalImg').src=src; }
function closeGalleryModal(e){ if(e.target===e.currentTarget||e.target.classList.contains('talk-gallery-close')) document.getElementById('galleryModal').classList.remove('open'); }
</script>
