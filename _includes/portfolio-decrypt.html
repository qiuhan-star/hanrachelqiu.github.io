<div id="pf-overlay" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg-base, #fafbfc);">
  <div style="text-align:center;max-width:340px;padding:2.5em 2em;">
    <div style="font-size:2.8em;line-height:1;margin-bottom:0.4em;">🔒</div>
    <h2 style="margin:0 0 0.5em;font-size:1.4em;color:var(--text-base, #1a1d24);">{{ include.title | default: "Password Required" }}</h2>
    <p style="margin:0 0 1.2em;color:var(--text-muted, #6b7280);">{{ include.desc | default: "This portfolio is password protected." }}</p>
    <input id="pf-pwd" type="password" autocomplete="off" style="width:100%;box-sizing:border-box;padding:0.6em 0.8em;font-size:1em;border:1px solid var(--border-base, #d0d7de);border-radius:8px;background:var(--surface, #fff);color:var(--text-base, #1a1d24);margin-bottom:0.8em;" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" />
    <button id="pf-go" style="width:100%;padding:0.6em 1em;font-size:1em;border:none;border-radius:8px;background:var(--accent, #5a7cd8);color:#fff;cursor:pointer;">{{ include.btn | default: "Unlock" }}</button>
    <p id="pf-err" style="display:none;color:#c0392b;margin:0.8em 0 0;font-size:0.9em;">{{ include.err | default: "Incorrect password." }}</p>
  </div>
</div>
<div id="pf-content" style="display:none"></div>
<script>
/* portfolio AES-GCM gate: the ciphertext lives in window.PF_CIPHER (set by the
   portfolio-cipher-*.html include). We derive the key from the typed passphrase
   with PBKDF2 and decrypt in the browser via Web Crypto. No plaintext ever ships. */
(function () {
  var B64 = window.PF_CIPHER || "";
  var ov = document.getElementById("pf-overlay");
  var ct = document.getElementById("pf-content");
  var inp = document.getElementById("pf-pwd");
  var btn = document.getElementById("pf-go");
  var err = document.getElementById("pf-err");
  var ITER = 150000, SALT_LEN = 16, IV_LEN = 12;

  function toBuf(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function decrypt(pass) {
    var bytes = toBuf(B64);
    var salt = bytes.slice(0, SALT_LEN);
    var iv = bytes.slice(SALT_LEN, SALT_LEN + IV_LEN);
    var data = bytes.slice(SALT_LEN + IV_LEN);
    return crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(pass),
      "PBKDF2",
      false,
      ["deriveKey"]
    ).then(function (baseKey) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
    }).then(function (plain) {
      return new TextDecoder().decode(plain);
    });
  }

  function unlock() {
    if (!inp.value) return;
    decrypt(inp.value).then(function (html) {
      if (!html) { err.style.display = "block"; inp.value = ""; inp.focus(); return; }
      err.style.display = "none";
      ct.innerHTML = html;
      ct.style.display = "block";
      ov.style.display = "none";
      try { sessionStorage.setItem("pf_unlocked", "1"); } catch (e) {}
    }).catch(function () {
      err.style.display = "block";
      inp.value = "";
      inp.focus();
    });
  }

  if (btn) btn.addEventListener("click", unlock);
  if (inp) {
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") unlock(); });
    inp.focus();
  }
})();
</script>
