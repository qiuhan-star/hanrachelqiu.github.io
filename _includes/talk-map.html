<!-- Multi-mode talks viewer: 3 switchable modes (By City / Timeline / List),
     all generated from the talks collection (single source of truth).
     UX: collapsible accordion (List), filter tabs + dynamic chips + live search,
     Export PDF. -->
<style>
  #talkMapWrap { position: relative; max-width:880px; }
  .talkmap-summary { color:var(--text-secondary); font-size:0.95rem; margin:0 0 1em; }
  .talkmap-seg { display:flex; flex-wrap:wrap; gap:4px; background:var(--bg-raised); border-radius:10px; padding:4px; margin:0 0 20px; }
  .talkmap-seg button { border:none; background:transparent; color:var(--text-secondary); font-size:0.9rem; padding:8px 14px; border-radius:8px; cursor:pointer; font-family:inherit; line-height:1.2; }
  .talkmap-seg button .sub { display:block; font-size:.68rem; color:var(--text-muted); margin-top:2px; opacity:.85; }
  .talkmap-seg button.active { background:var(--bg-surface); color:var(--text-primary); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .talkmap-seg button.active .sub { color:var(--accent); opacity:1; }
  .talkmap-panel { display:none; }
  .talkmap-panel.active { display:block; }

  /* control bar: view switcher + search + filter + export on one row */
  .tm-bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin:0 0 12px; }
  .tm-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex:1 1 auto; justify-content:flex-end; }
  #talkMapSearch { border:1px solid var(--border-subtle); background:var(--bg-base); color:var(--text-primary); border-radius:8px; padding:7px 12px; font-size:.82rem; min-width:160px; flex:1 1 160px; max-width:260px; font-family:inherit; }
  /* dropdown (Filter / Export) */
  .tm-drop { position:relative; }
  .tm-drop-btn { border:1px solid var(--border-subtle); background:var(--bg-raised); color:var(--text-secondary); padding:7px 13px; border-radius:8px; cursor:pointer; font-size:.82rem; font-family:inherit; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .tm-drop-btn:hover { border-color:var(--accent); color:var(--accent); }
  .tm-drop-btn.tm-ghost { background:transparent; color:var(--text-secondary); border-color:var(--border-subtle); }
  .tm-drop-btn.tm-ghost:hover { background:transparent; color:var(--accent); border-color:var(--accent); }
  .tm-drop.open .tm-drop-btn { border-color:var(--accent); color:var(--accent); }
  .tm-drop-menu { position:absolute; top:calc(100% + 6px); right:0; z-index:30; min-width:224px; max-height:340px; overflow:auto; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:10px; box-shadow:0 8px 24px rgba(20,30,50,.16); padding:8px; display:none; }
  .tm-drop.open .tm-drop-menu { display:block; }
  .tm-drop-grp { padding:2px; }
  .tm-drop-grp + .tm-drop-grp { border-top:1px solid var(--border-subtle); margin-top:4px; padding-top:8px; }
  .tm-drop-h { font-size:.66rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); padding:4px 8px 6px; }
  .tm-drop-item { display:block; width:100%; text-align:left; border:none; background:transparent; color:var(--text-primary); padding:7px 10px; border-radius:7px; cursor:pointer; font-size:.82rem; font-family:inherit; }
  .tm-drop-item:hover { background:var(--bg-raised); }
  .tm-drop-item.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .tm-drop-item:disabled { color:var(--text-muted); cursor:not-allowed; opacity:.6; }
  .tm-drop-item:disabled:hover { background:transparent; }
  /* active filter chip */
  .talkmap-dynfilter { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 16px; }
  .talkmap-dynfilter button { border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); padding:5px 11px; border-radius:999px; cursor:pointer; font-size:.78rem; font-weight:600; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
  .talkmap-dynfilter button .x { font-size:.7rem; opacity:.7; }

  /* wall */
  .talkmap-stat { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .talkmap-stat .box { background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:10px; padding:12px 18px; }
  .talkmap-stat .n { font-size:1.5rem; font-weight:700; color:var(--text-primary); }
  .talkmap-stat .l { font-size:.8rem; color:var(--text-secondary); }
  .talkmap-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; align-items:stretch; }
  .talkmap-city { background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:14px; padding:14px 16px; transition:transform .18s ease, box-shadow .18s ease; display:flex; flex-direction:column; }
  .talkmap-city:hover { transform:translateY(-2px); box-shadow:var(--shadow-hover); }
  .talkmap-city .cn { font-size:1.1rem; font-weight:700; color:var(--accent); }
  .talkmap-city .cityrow { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .talkmap-city .en { font-size:.78rem; color:var(--text-secondary); margin-left:6px; }
  .talkmap-city .cc { font-size:.66rem; font-weight:700; letter-spacing:.04em; padding:1px 6px; border-radius:5px; background:var(--bg-raised); color:var(--accent); }
  .talkmap-city .count { margin-left:auto; background:var(--bg-raised); color:var(--text-secondary); font-weight:700; font-size:.82rem; padding:2px 10px; border-radius:20px; }
  .talkmap-city .city-list { list-style:none; margin:0 0 6px; padding:0; }
  .talkmap-city .city-list li { display:block; padding:0; }
  .talkmap-city .city-list li:first-child { padding-top:2px; }
  .talkmap-city .city-list li + li { border-top:1px dashed var(--border-subtle); margin-top:14px; padding-top:14px; }
  .talkmap-city .institution-item { display:flex; flex-direction:column; gap:3px; }
  .talkmap-city .inst-name { font-size:.9rem; font-weight:600; color:var(--text-primary); line-height:1.35; }
  .talkmap-city .inst-meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap; color:var(--text-secondary); font-size:.8rem; }
  .talkmap-city .inst-meta .n { font-weight:600; color:var(--text-muted); white-space:nowrap; }
  .talkmap-city .inst-meta .dot { opacity:.5; }
  /* award tag */
  .talkmap-city .city-awards { display:flex; align-items:center; justify-content:center; gap:6px; text-align:center; font-size:.8rem; font-weight:600; color:#92732a; background:#fff7e0; border:1px solid #f0e0b0; border-radius:8px; padding:7px 10px; margin:10px 0 2px; }
  :root[data-theme="dark"] .talkmap-city .city-awards { background:#2f2a1c; color:#d8c074; border-color:#4a3f1f; }
  /* actions pinned to bottom — footer height identical across all cards */
  .talkmap-city .city-actions { display:flex; gap:8px; margin-top:auto; padding-top:12px; }
  .talkmap-city .city-actions .talkmap-res { flex:1 1 0; justify-content:center; margin:0; }
  /* single-button cards: primary CTA sits bottom-right (same anchor as in 2-button cards) */
  .talkmap-city .city-actions.single { justify-content:flex-end; }
  .talkmap-city .city-actions.single .talkmap-res { flex:0 0 auto; }

  /* journey — vertical timeline, spine on right, bottom→top, separators between nodes */
  .talkmap-jtrack { position:relative; display:flex; flex-direction:column-reverse; padding:6px 0 2px; }
  .talkmap-jtrack::after { content:''; position:absolute; top:14px; bottom:14px; right:120px; width:2px; background:var(--border-subtle); z-index:0; }
  .talkmap-jnode { position:relative; display:flex; align-items:flex-start; margin:0; padding:11px 0; border-bottom:1px dashed var(--border-subtle); }
  .talkmap-jnode:last-child { border-bottom:none; }
  .talkmap-jcard { flex:1; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:10px; padding:11px 15px; margin-right:22px; position:relative; transition:transform .18s ease, box-shadow .18s ease; }
  .talkmap-jcard:hover { transform:translateY(-2px); box-shadow:var(--shadow-hover); }
  .talkmap-jcard .t-row { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .talkmap-jcard .t { font-weight:600; font-size:.97rem; line-height:1.45; padding-right:0; max-width:74%; margin-right:14px; }
  .talkmap-jcard .t a { color:var(--text-primary); text-decoration:none; }
  .talkmap-jcard .t a:hover { color:var(--accent); text-decoration:underline; }
  .talkmap-jcard .m { color:var(--text-secondary); font-size:.83rem; margin-top:2px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .talkmap-jcard .sep { color:var(--text-secondary); opacity:.5; }
  .talkmap-jcard .zh { color:var(--text-secondary); font-weight:600; }
  .talkmap-jcard .lang-tag { display:inline-block; font-size:.75rem; font-weight:600; color:#64748b; background:#f1f5f9; padding:2px 6px; border-radius:4px; }
  :root[data-theme="dark"] .talkmap-jcard .lang-tag { color:#9aa6b6; background:#2a313c; }
  /* award now rendered inside .badge-cluster as .award-pill */
  .talkmap-jcard .pill { display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.01em; padding:2px 9px; border-radius:6px; }
  .talkmap-jcard .pill.conf { background:#dce9fc; color:#1f63c8; }
  .talkmap-jcard .pill.work { background:#dcf3e4; color:#1d8a4e; }
  .talkmap-jcard .pill.sem  { background:#efe8fb; color:#6f4fc0; }
  .talkmap-jcard .pill.inv  { background:#fbf0d8; color:#9a6a14; }
  /* badge cluster — type + award, top-right anchor (out of title/meta flow) */
  .badge-cluster { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-start; align-items:center; }
  .award-pill { display:inline-block; font-size:.7rem; font-weight:700; padding:2px 9px; border-radius:6px; background:#fff7e0; color:#92732a; border:1px solid #f0e0b0; }
  .talkmap-jcard .badge-cluster { position:absolute; top:11px; right:15px; margin:0; }
  .talkmap-jcard .t-row .badge-cluster { position:static; top:auto; right:auto; margin:2px 0 0; flex:0 0 auto; }
  .talkmap-jaxis { width:120px; position:relative; text-align:right; padding-right:6px; }
  .talkmap-jaxis .dot { position:absolute; left:-9px; top:13px; width:18px; height:18px; border-radius:50%; background:var(--accent); border:3px solid var(--bg-base); z-index:1; }
  /* axis node (dot + date) top-aligned to card's first title line; dot color unified to --accent */
  .talkmap-jaxis .date { font-weight:700; font-size:.9rem; color:var(--text-primary); margin-top:13px; }
  .talkmap-jaxis .loc { font-size:.8rem; color:var(--text-secondary); margin-top:2px; display:flex; justify-content:flex-end; align-items:center; gap:5px; }
  /* journey axis: force city + country onto two lines (right-aligned) */
  .talkmap-jaxis .loc .loc-full { display:block; text-align:right; line-height:1.25; }
  .talkmap-jaxis .loc .loc-city { display:inline; }
  .talkmap-jaxis .loc .loc-country { display:block; font-weight:500; opacity:.82; font-size:.92em; margin-top:1px; }
  .talkmap-jcard .venue { color:var(--accent); font-weight:600; font-size:.82rem; margin-top:6px; }
  .cc { display:inline-block; font-size:.66rem; font-weight:700; letter-spacing:.04em; padding:1px 6px; border-radius:5px; background:var(--bg-raised); color:var(--accent); vertical-align:middle; margin-left:4px; }
  .city { color:var(--accent); font-weight:700; }
  .talkmap-yh { font-size:1.05rem; font-weight:700; color:var(--text-primary); margin:22px 0 10px; border-left:4px solid var(--accent); padding-left:10px; }
  .talkmap-talk { background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:10px; padding:11px 15px; margin-bottom:9px; }
  .talkmap-talk .t { font-weight:600; }
  .talkmap-talk .m { color:var(--text-secondary); font-size:.84rem; margin-top:4px; }
  .talkmap-talk .aw { color:#b8860b; font-weight:600; margin-left:8px; }

  /* text only / List (accordion) */
  .talkmap-text .t-item { padding:11px 0; border-bottom:1px solid var(--border-subtle); }
  .talkmap-text .t-title { font-weight:600; font-size:0.98rem; line-height:1.5; }
  .talkmap-text .t-title a { color:var(--text-primary); text-decoration:none; }
  .talkmap-text .t-title a:hover { color:var(--accent); text-decoration:underline; }
  .talkmap-text .t-meta { color:var(--text-secondary); font-size:0.84rem; margin-top:4px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .talkmap-text .sep { color:var(--text-secondary); opacity:.5; }
  .talkmap-text .zh { color:var(--text-secondary); font-weight:600; }
  .talkmap-text .award { color:#92732a; font-weight:600; }
  .talkmap-text .pill { display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.01em; padding:2px 9px; border-radius:6px; }
  .talkmap-text .pill.conf { background:#dce9fc; color:#1f63c8; }
  .talkmap-text .pill.work { background:#dcf3e4; color:#1d8a4e; }
  .talkmap-text .pill.sem  { background:#efe8fb; color:#6f4fc0; }
  .talkmap-text .pill.inv  { background:#fbf0d8; color:#9a6a14; }
  .talkmap-text .venue-em { color:var(--accent); font-weight:600; }
  .talkmap-yh .cnt { font-size:.8rem; color:var(--text-secondary); font-weight:400; margin-left:8px; }

  /* accordion (List view) */
  .talkmap-acc { background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:10px; margin-bottom:9px; box-shadow:0 1px 3px rgba(20,30,50,.06); transition:transform .18s ease, box-shadow .18s ease; }
  .talkmap-acc:hover { transform:translateY(-2px); box-shadow:var(--shadow-hover); }
  .talkmap-acc-head { display:flex; align-items:flex-start; gap:12px; padding:12px 15px; cursor:pointer; }
  .talkmap-acc-main { flex:1; min-width:0; position:relative; }
  .talkmap-acc .t-title { font-weight:600; font-size:.98rem; line-height:1.5; color:var(--text-primary); padding-right:120px; }
  .talkmap-acc-main .badge-cluster { position:absolute; top:10px; right:14px; margin:0; }
  .talkmap-acc .t-meta { color:var(--text-secondary); font-size:.84rem; margin-top:3px; display:block; }
  /* structured multi-row meta: each field on its own wrapping row */
  .tm-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:5px; }
  .tm-row1 { margin-top:0; }
  .tm-dot { color:var(--text-secondary); opacity:.5; }
  /* floating type badge — split "Conference Presentation" into two lines at the space */
  .talkmap-jcard .t-row .badge-cluster .pill { white-space:normal; max-width:100px; text-align:center; line-height:1.14; padding:5px 8px; }
  /* award: de-emphasized, sits at the end of the card (not a bold gold pill) */
  .tm-award { display:block; font-size:.8rem; font-weight:500; color:#92732a; margin:9px 0 0; opacity:.9; }
  :root[data-theme="dark"] .tm-award { background:transparent; border:none; color:#d8c074; }
  .loc-full { color:var(--accent); font-weight:600; }
  /* award now rendered inside .badge-cluster as .award-pill */
  .talkmap-chev { display:inline-block; margin-top:10px; color:var(--accent); font-size:.8rem; font-weight:600; background:var(--accent-soft); border:1px solid var(--accent); padding:5px 12px; border-radius:8px; cursor:pointer; }
  .talkmap-acc-body { max-height:0; overflow:hidden; transition:max-height .28s ease; }
  .talkmap-acc.open .talkmap-acc-body { max-height:2000px; }
  .talkmap-acc-inner { padding:0 15px 14px; border-top:1px dashed var(--border-subtle); margin-top:-1px; }
  .talkmap-acc-abs { color:var(--text-secondary); font-size:.9rem; margin:12px 0 10px; }
  .talkmap-res-row { display:flex; flex-wrap:wrap; gap:0; margin:8px 0; }
  .talkmap-res { display:inline-flex; align-items:center; gap:5px; text-decoration:none; font-size:.78rem; font-weight:600; border:1px solid var(--border-subtle); color:var(--accent); background:transparent; padding:6px 11px; border-radius:8px; margin:0 6px 6px 0; }
  .talkmap-res.btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .talkmap-res:hover { background:var(--accent); color:#fff; }
  .talkmap-muted { color:var(--text-muted); font-size:.82rem; }

  /* timeline cards are now collapsible (merged with List's accordion behavior) */
  .talkmap-jcard.talkmap-acc { margin-bottom:0; }
  .talkmap-jcard .talkmap-acc-head { display:block; padding:0; }
  .talkmap-jcard .talkmap-acc-inner { padding:0 15px 14px; border-top:1px dashed var(--border-subtle); margin:10px -15px -11px; }

  /* shadows (local, since --shadow is not a site token) */
  :root { --shadow-hover:0 6px 18px rgba(40,60,100,.14); }
  :root[data-theme="dark"] { --shadow-hover:0 6px 18px rgba(0,0,0,.5); }
  html { scroll-behavior:smooth; }

  /* 4-color pills — dark theme overrides */
  :root[data-theme="dark"] .talkmap-jcard .pill.conf, :root[data-theme="dark"] .talkmap-text .pill.conf { background:#15294d; color:#7fb0ff; }
  :root[data-theme="dark"] .talkmap-jcard .pill.work, :root[data-theme="dark"] .talkmap-text .pill.work { background:#15301f; color:#7fc79a; }
  :root[data-theme="dark"] .talkmap-jcard .pill.sem,  :root[data-theme="dark"] .talkmap-text .pill.sem  { background:#241f38; color:#b9a8e8; }
  :root[data-theme="dark"] .talkmap-jcard .pill.inv,  :root[data-theme="dark"] .talkmap-text .pill.inv  { background:#2f2a1c; color:#d8c074; }
  :root[data-theme="dark"] .award-pill { background:#2f2a1c; color:#d8c074; border-color:#4a3f1f; }
  strong.pres { font-weight:700; color:var(--text-primary); }
  .talkmap-jcard .conf, .talkmap-text .conf { min-width:0; }

  /* print: hide chrome, expand all accordions */
  @media print {
    .tm-bar, .talkmap-dynfilter, .talkmap-seg, #talkMapSearch, .tm-drop { display:none !important; }
    .talkmap-acc-body { max-height:none !important; }
    .talkmap-acc { box-shadow:none !important; break-inside:avoid; }
  }
</style>

<div id="talkMapWrap">
  {% assign talk_items = site.talks | where_exp: "t", "t.lang != 'zh-CN'" %}
  {% assign _yrs = talk_items | map: 'date' | sort %}
  <p class="talkmap-summary"><strong>{{ talk_items.size }}</strong> <span data-lang="en">Talks &amp; Presentations ({{ _yrs.first | date: '%Y' }}–{{ _yrs.last | date: '%Y' }})</span><span data-lang="zh">场演讲与报告（{{ _yrs.first | date: '%Y' }}–{{ _yrs.last | date: '%Y' }}）</span></p>

  <div class="tm-bar">
    <div class="talkmap-seg" id="talkMapSeg">
      <button data-mode="journey" title="Collapsible vertical timeline"><span data-lang="en">Timeline</span><span data-lang="zh">时间轴</span></button>
      <button data-mode="wall" title="Group talks by city"><span data-lang="en">By City</span><span data-lang="zh">按城市</span></button>
    </div>
    <div class="tm-tools">
      <input id="talkMapSearch" placeholder="Search talks…" />
      <div class="tm-drop" id="tmFilterWrap">
        <button class="tm-drop-btn" id="tmFilterBtn" title="Filter by year / location / type">▾ <span data-lang="en">Filter</span><span data-lang="zh">筛选</span></button>
        <div class="tm-drop-menu" id="tmFilterMenu"></div>
      </div>
      <div class="tm-drop" id="tmExportWrap">
        <button class="tm-drop-btn tm-ghost" id="tmExportBtn" title="Export options">📥 <span data-lang="en">Export</span><span data-lang="zh">导出</span> ▾</button>
        <div class="tm-drop-menu">
          <button class="tm-drop-item" data-act="pdf"><span data-lang="en">Export PDF</span><span data-lang="zh">导出 PDF</span></button>
          <button class="tm-drop-item" data-act="zip" disabled><span data-lang="en">Download All</span><span data-lang="zh">下载全部</span></button>
        </div>
      </div>
    </div>
  </div>

  <div class="talkmap-dynfilter" id="talkMapDyn"></div>

  <div class="talkmap-panel" id="panel-wall"></div>
  <div class="talkmap-panel" id="panel-journey"></div>
</div>

<script>
/* single source of truth: talks from the Jekyll collection (Liquid -> JSON) */
var talksData = [
{% for t in talk_items %}
  {
    "title": {{ t.title | jsonify }},
    "title_zh": {{ t.title_zh | jsonify }},
    "venue": {{ t.venue | jsonify }},
    "city": {{ t.location | jsonify }},
    "conf": {{ t.type | jsonify }},
    "date": "{{ t.date | date: '%Y-%m-%d' }}",
    "lang": {{ t.presented_in | jsonify }},
    "award": {{ t.award | jsonify }},
    "kind": {{ t.kind | jsonify }},
    "hide_on_map": {{ t.hide_on_map | jsonify }},
    "important": {{ t.important | jsonify }},
    "permalink": {{ t.permalink | jsonify }},
    "abstract": {{ t.abstract | jsonify }},
    "slides_url": {{ t.slides_url | jsonify }},
    "video_url": {{ t.video_url | jsonify }},
    "poster_url": {{ t.poster_url | jsonify }},
    "doi": {{ t.doi | jsonify }},
    "conf_url": {{ t.conf_url | jsonify }},
    "wechat_url": {{ t.wechat_url | jsonify }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}
];
/* geo views (map / wall / journey / map+wall / list+loc) exclude text-only entries */
var geoTalks = talksData.filter(function(t){ return !t.hide_on_map; });

var isZh = (document.documentElement.getAttribute('data-lang') === 'zh');

/* venue -> coordinates + short labels (only the geographic lookup is hardcoded) */
var venueCoords = {
  "The Hong Kong University of Science and Technology (HKUST)": [22.3366, 114.2655],
  "Shenyang Normal University": [41.8057, 123.4315],
  "Chengzhi Building 108, School of Public Affairs/Institute of Public Policy, Xiamen University": [24.7898, 118.0899],
  "Tsinghua University": [40.0007, 116.3263],
  "Chinese University of Hong Kong": [22.4197, 114.2070],
  "National Taiwan University": [25.0173, 121.5347],
  "Edith Cowan University": [-31.7455, 115.7760],
  "Xi'an Jiaotong University": [34.3416, 108.9398]
};
var shortNames = {
  "The Hong Kong University of Science and Technology (HKUST)": { zh:"港科大", en:"HKUST" },
  "Shenyang Normal University": { zh:"沈师", en:"SYNU" },
  "Chengzhi Building 108, School of Public Affairs/Institute of Public Policy, Xiamen University": { zh:"厦大", en:"XMU" },
  "Tsinghua University": { zh:"清华", en:"Tsinghua" },
  "Chinese University of Hong Kong": { zh:"港中文", en:"CUHK" },
  "National Taiwan University": { zh:"台大", en:"NTU" },
  "Edith Cowan University": { zh:"埃迪斯科文", en:"ECU" },
  "Xi'an Jiaotong University": { zh:"西安交大", en:"XJTU" }
};
/* venue -> ISO country/region code. Only Edith Cowan University (Australia) is
   outside China; Hong Kong / Macau / Taiwan are all tagged CN. */
var venueCountry = {
  "The Hong Kong University of Science and Technology (HKUST)": "CN",
  "Shenyang Normal University": "CN",
  "Chengzhi Building 108, School of Public Affairs/Institute of Public Policy, Xiamen University": "CN",
  "Tsinghua University": "CN",
  "Chinese University of Hong Kong": "CN",
  "National Taiwan University": "CN",
  "Edith Cowan University": "AU",
  "Xi'an Jiaotong University": "CN"
};
function countryFromVenue(v){ return venueCountry[canonVenue(v)] || 'CN'; }
function countryFromLoc(loc){
  if(!loc) return 'CN';
  if(isZh) return loc.indexOf('澳大利亚') === 0 ? 'AU' : 'CN';
  return loc.split(',').pop().trim() === 'Australia' ? 'AU' : 'CN';
}
function countryOf(t){ return countryFromVenue(t.venue); }
/* venue display name: ZH page shows the full Chinese name; EN page shows the
   full English name (no abbreviation) so schools read as complete names. */
var venueFullName = {
  "The Hong Kong University of Science and Technology (HKUST)": "The Hong Kong University of Science and Technology",
  "Shenyang Normal University": "Shenyang Normal University",
  "Chengzhi Building 108, School of Public Affairs/Institute of Public Policy, Xiamen University": "Xiamen University",
  "Tsinghua University": "Tsinghua University",
  "Chinese University of Hong Kong": "The Chinese University of Hong Kong",
  "National Taiwan University": "National Taiwan University",
  "Edith Cowan University": "Edith Cowan University",
  "Xi'an Jiaotong University": "Xi'an Jiaotong University"
};
function fullVenue(t){
  if(isZh) return t.venue;
  var key = canonVenue(t.venue);
  return venueFullName[key] || t.venue.split('(')[0].trim();
}
var pinOffset = {
  "The Hong Kong University of Science and Technology (HKUST)": [8, 40],
  "Chinese University of Hong Kong": [8, -8]
};
/* Chinese venue strings -> canonical EN key (single source for coords/short).
   The ZH talk files store venue in Chinese, so we alias them back to the EN
   canonical key used by venueCoords/shortNames instead of duplicating tables. */
var venueAlias = {
  "西安交通大学": "Xi'an Jiaotong University",
  "沈阳师范大学": "Shenyang Normal University",
  "香港中文大学": "Chinese University of Hong Kong",
  "国立台湾大学": "National Taiwan University",
  "香港科技大学（HKUST）": "The Hong Kong University of Science and Technology (HKUST)",
  "厦门大学公共事务学院/公共政策研究院，成智楼108": "Chengzhi Building 108, School of Public Affairs/Institute of Public Policy, Xiamen University",
  "埃迪斯科文大学": "Edith Cowan University",
  "清华大学": "Tsinghua University"
};
function canonVenue(v){ return venueAlias[v] || v; }
function shortOf(venue){ var s = shortNames[canonVenue(venue)]; if(s){ return isZh ? s.zh : s.en; } var p = venue.split('('); return p[0].trim(); }
function coordOf(venue){ return venueCoords[canonVenue(venue)] || [30, 114]; }

function escapeHtml(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function dispTitle(it){ return (isZh && it.title_zh) ? it.title_zh : it.title; }
/* bold ONLY the literal word "Presenter"; "(with X)" and " at ..." stay normal */
function metaConf(t){
  var c = (t.conf || '').trim();
  var m = c.match(/^(Presenter(?:\s*\([^)]*\))?)\s*(?:at\s+)?(.*)$/);
  if(m){
    var role = m[1];
    var rest = m[2].replace(/^\s*the\s+/i, '');
    var html = '<span class="conf"><strong class="pres">'+escapeHtml(role)+'</strong>';
    if(rest){ html += ' <span class="tm-dot">·</span> ' + escapeHtml(rest); }
    html += '</span>';
    return html;
  }
  return '<span class="conf">'+escapeHtml(c)+'</span>';
}

/* group talks by venue (school) — used by the wall stat (schools count) */
var byVenue = {};
geoTalks.forEach(function(t){
  if(!byVenue[t.venue]){ byVenue[t.venue] = { lat: coordOf(t.venue)[0], lng: coordOf(t.venue)[1], city: t.city, items: [], award:false }; }
  byVenue[t.venue].items.push(t);
  if(t.award){ byVenue[t.venue].award = true; }
});
/* distinct cities (global, for the wall stat) */
var byCityGlobal = {};
geoTalks.forEach(function(t){ byCityGlobal[t.city.split(',')[0].trim()] = 1; });

/* (Leaflet map builders removed; remaining modes: By City / Timeline / List) */

/* ===== filter / search state ===== */
var state = { facet:'all', facetValue:null, query:'' };
function kindLabel(k){ var m={conference:'Conference Presentation',workshop:'Workshop',seminar:'Seminar',invited:'Invited Talk'}; return m[k]||'Conference Presentation'; }
function matches(t){
  if(state.facet!=='all' && state.facetValue){
    if(state.facet==='year' && t.date.slice(0,4)!==state.facetValue) return false;
    if(state.facet==='location' && t.city!==state.facetValue) return false;
    if(state.facet==='type' && t.kind!==state.facetValue) return false;
  }
  if(state.query){
    var q=state.query.toLowerCase();
    var hay=(t.title+' '+(t.venue||'')+' '+(t.conf||'')+' '+(t.abstract||'')).toLowerCase();
    if(hay.indexOf(q)===-1) return false;
  }
  return true;
}
function resBtn(label,url,cls){ return '<a class="talkmap-res'+(cls?' '+cls:'')+'" href="'+escapeHtml(url)+'" target="_blank" rel="noopener">'+label+'</a>'; }
function resRow(t){
  var res='';
  if(t.slides_url) res+=resBtn('📄 Slides', t.slides_url, 'btn-secondary');
  if(t.video_url) res+=resBtn('▶ Video', t.video_url, 'btn-secondary');
  if(t.poster_url) res+=resBtn('🖼 Poster', t.poster_url, 'btn-secondary');
  if(t.doi) res+=resBtn('🔗 DOI', 'https://doi.org/'+t.doi, 'btn-secondary');
  if(t.conf_url) res+=resBtn('Official Site', t.conf_url, 'btn-secondary');
  if(t.wechat_url) res+=resBtn('Post', t.wechat_url, 'btn-secondary');
  if(t.permalink) res+=resBtn('View Details', t.permalink, 'btn-primary');
  return res ? '<div class="talkmap-res-row">'+res+'</div>' : '';
}
function detailHtml(t){
  var h='';
  if(t.abstract){ h+='<p class="talkmap-acc-abs">'+escapeHtml(t.abstract)+'</p>'; }
  h += resRow(t);
  return h;
}

/* ---- wall panel ---- */
function renderWall(){
  var filtered = geoTalks.filter(matches);
  var cities = {};
  filtered.forEach(function(t){
    var c = t.city.split(',')[0].trim();
    if(!cities[c]){ cities[c] = { en: t.city, schools:{}, count:0, award:0, confUrl:null }; }
    if(!cities[c].schools[t.venue]){ cities[c].schools[t.venue] = { short: shortOf(t.venue), count:0, award:false, talk:null }; }
    cities[c].schools[t.venue].count++;
    cities[c].schools[t.venue].award = cities[c].schools[t.venue].award || !!t.award;
    if(t.award){ cities[c].award++; }
    if(!cities[c].schools[t.venue].talk){ cities[c].schools[t.venue].talk = t; }
    if(t.conf_url && !cities[c].confUrl){ cities[c].confUrl = t.conf_url; }
    cities[c].count++;
  });
  var cityNames = Object.keys(cities);
  var html = '<div class="talkmap-stat">'
    + '<div class="box"><div class="n">' + talksData.length + '</div><div class="l">' + (isZh ? '场受邀演讲' : 'talks') + '</div></div>'
    + '<div class="box"><div class="n">' + Object.keys(byCityGlobal).length + '</div><div class="l">' + (isZh ? '座城市' : 'cities') + '</div></div>'
    + '<div class="box"><div class="n">' + Object.keys(byVenue).length + '</div><div class="l">' + (isZh ? '所机构' : 'institutions') + '</div></div>'
    + '</div><div class="talkmap-grid">';
  cityNames.forEach(function(cn){
    var c = cities[cn];
    var cc = countryFromLoc(c.en);
    /* single-talk city → that talk's permalink; otherwise → city-filtered talks page */
    var viewHref = '#';
    if(c.count === 1){
      Object.keys(c.schools).forEach(function(v){ if(c.schools[v].talk && c.schools[v].talk.permalink) viewHref = c.schools[v].talk.permalink; });
    } else {
      viewHref = '/talks/?location=' + encodeURIComponent(c.en);
    }
    html += '<div class="talkmap-city" data-href="' + escapeHtml(viewHref) + '">'
      + '<div class="cityrow"><span class="cn">' + escapeHtml(cn) + '</span><span class="cc">' + cc + '</span><span class="count">' + c.count + (isZh ? ' 场' : '') + '</span></div>'
      + '<ul class="city-list">';
    Object.keys(c.schools).forEach(function(v){
      var s = c.schools[v];
      var metaInner = '<span class="n">' + s.count + (s.count === 1 ? (isZh ? ' 场' : ' talk') : (isZh ? ' 场' : ' talks')) + '</span>';
      if(s.count === 1 && s.talk){
        var wk = (s.talk.kind || 'conference');
        var wcls = (wk === 'workshop') ? 'work' : (wk === 'seminar') ? 'sem' : (wk === 'invited') ? 'inv' : 'conf';
        var wmap = { conference:'Conference Presentation', workshop:'Workshop', seminar:'Seminar', invited:'Invited Talk' };
        metaInner += '<span class="dot">·</span><span class="pill ' + wcls + '">' + (wmap[wk] || 'Conference Presentation') + '</span>';
      }
      html += '<li><div class="institution-item">'
        + '<div class="inst-name">📍 ' + escapeHtml(fullVenue({ venue:v })) + '</div>'
        + '<div class="inst-meta">' + metaInner + '</div>'
        + '</div></li>';
    });
    html += '</ul>';
    if(c.award > 0){
      var awLabel = isZh ? '优秀论文奖' : ('Outstanding Research Paper Award' + (c.award > 1 ? 's' : ''));
      html += '<div class="city-awards">🏆 ' + c.award + ' ' + awLabel + '</div>';
    }
    var hasOfficial = !!c.confUrl;
    var actions = '';
    if(hasOfficial){ actions += resBtn('Official Site', c.confUrl, 'btn-secondary'); }
    actions += resBtn('View Details', viewHref, 'btn-primary');
    html += '<div class="city-actions' + (hasOfficial ? '' : ' single') + '">' + actions + '</div></div>';
  });
  html += '</div>';
  document.getElementById('panel-wall').innerHTML = html;
}

/* ---- journey panel: vertical timeline, spine on the right, bottom→top ---- */
/* ---- journey / Timeline panel: vertical timeline, collapsible accordion ---- */
function renderJourney(){
  function kindPill(t){
    var map = { conference:'Conference Presentation', workshop:'Workshop', seminar:'Seminar', invited:'Invited Talk' };
    var k = (t.kind || 'conference');
    var cls = (k === 'workshop') ? 'work' : (k === 'seminar') ? 'sem' : (k === 'invited') ? 'inv' : 'conf';
    return '<span class="pill ' + cls + '">' + (map[k] || 'Conference Presentation') + '</span>';
  }
  var items = geoTalks.filter(matches).slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  var html = '<div class="talkmap-jtrack">';
  items.forEach(function(t){
    var titleHtml = escapeHtml(dispTitle(t));
    if(t.permalink){ titleHtml = '<a href="' + escapeHtml(t.permalink) + '">' + titleHtml + '</a>'; }
    var langTag = (t.lang === 'zh') ? (isZh ? '中文' : 'Chinese') : '';
    var meta = metaConf(t)
      + (langTag ? ' <span class="lang-tag">' + escapeHtml(langTag) + '</span>' : '');
    var awardTag = t.award ? '<div class="tm-award">🏆 ' + escapeHtml(t.award) + '</div>' : '';
    var typeBadge = '<div class="badge-cluster">' + kindPill(t) + '</div>';
    var cityParts = (t.city || '').split(',');
    var cityName = cityParts[0].trim();
    var countryName = cityParts.length > 1 ? cityParts.slice(1).join(',').trim() : '';
    var cityLoc = '<span class="loc-full"><span class="loc-city">' + escapeHtml(cityName) + '</span>'
      + (countryName ? '<span class="loc-country">' + escapeHtml(countryName) + '</span>' : '')
      + '</span>';
    /* collapsed header: title · type badge · meta · venue; links hidden until expand */
    var detail = '';
    if(t.abstract){ detail += '<p class="talkmap-acc-abs">' + escapeHtml(t.abstract) + '</p>'; }
    detail += resRow(t);
    html += '<div class="talkmap-jnode"><div class="talkmap-jcard talkmap-acc">'
      + '<div class="talkmap-acc-head" onclick="hqToggleAcc(this)">'
      + '<div class="t-row"><div class="t">' + titleHtml + '</div>'
      + typeBadge
      + '</div>'
      + '<div class="m">' + meta + '</div>'
      + '<div class="venue">' + escapeHtml(fullVenue(t)) + (t.city ? ', ' + escapeHtml(t.city) : '') + '</div>'
      + awardTag
      + '<div class="talkmap-chev">▼ <span class="chev-label">'+(isZh?'展开摘要':'Show Abstract')+'</span></div>'
      + '</div>'
      + '<div class="talkmap-acc-body"><div class="talkmap-acc-inner">' + detail + '</div></div>'
      + '</div>'
      + '<div class="talkmap-jaxis"><span class="dot"></span>'
      + '<div class="date">' + escapeHtml(t.date.slice(0,7)) + '</div></div></div>';
  });
  html += '</div>';
  document.getElementById('panel-journey').innerHTML = html;
}

/* ---- text / List panel removed: UI exposes only Timeline + By City ---- */

function renderAll(){ renderWall(); renderJourney(); }
function hqToggleAcc(el){
  var acc = el.closest('.talkmap-acc');
  if(!acc) return;
  var open = acc.classList.toggle('open');
  var chev = acc.querySelector('.talkmap-chev');
  if(chev){
    var lab = chev.querySelector('.chev-label');
    if(lab){ lab.textContent = isZh ? (open ? '收起摘要' : '展开摘要') : (open ? 'Hide Abstract' : 'Show Abstract'); }
    if(chev.firstChild && chev.firstChild.nodeType === 3){ chev.firstChild.nodeValue = open ? '▲ ' : '▼ '; }
  }
}

/* active filter chip (single, removable) */
function renderDyn(){
  var box = document.getElementById('talkMapDyn');
  if(state.facet==='all' || !state.facetValue){ box.innerHTML=''; return; }
  var lab;
  if(state.facet==='year') lab = state.facetValue;
  else if(state.facet==='location') lab = state.facetValue.split(',')[0].trim();
  else lab = kindLabel(state.facetValue);
  box.innerHTML = '<button data-v="__all" class="active">'+escapeHtml(lab)+' <span class="x">✕</span></button>';
  box.querySelector('button').onclick = function(){ state.facet='all'; state.facetValue=null; buildFilterMenu(); renderDyn(); renderAll(); };
}

/* ---- switcher + persistence ---- */
var activeMode = 'journey';
var seg = document.getElementById('talkMapSeg');
function activate(mode){
  activeMode = mode;
  seg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-mode') === mode); });
  document.querySelectorAll('.talkmap-panel').forEach(function(p){ p.classList.toggle('active', p.id === 'panel-' + mode); });
  try { localStorage.setItem('hq-talks-mode', mode); } catch(e){}
}
seg.addEventListener('click', function(e){
  var btn = e.target.closest('button'); if(!btn) return;
  activate(btn.getAttribute('data-mode'));
});
/* search */
document.getElementById('talkMapSearch').addEventListener('input', function(e){ state.query = e.target.value.trim(); renderAll(); });

/* ---- Filter dropdown (concrete values grouped by Year / Location / Type) ---- */
var tmFilterWrap = document.getElementById('tmFilterWrap');
var tmFilterMenu = document.getElementById('tmFilterMenu');
var tmExportWrap = document.getElementById('tmExportWrap');
function tmCloseAllDrops(){ document.querySelectorAll('.tm-drop.open').forEach(function(d){ d.classList.remove('open'); }); }
function tmToggleDrop(wrap, e){ e.stopPropagation(); var wasOpen = wrap.classList.contains('open'); tmCloseAllDrops(); if(!wasOpen) wrap.classList.add('open'); }
function buildFilterMenu(){
  var years=[], locs=[], types=[];
  talksData.forEach(function(t){
    var y=t.date.slice(0,4); if(years.indexOf(y)<0) years.push(y);
    var full=t.city||''; if(full && locs.indexOf(full)<0) locs.push(full);
    var k=t.kind||'conference'; if(types.indexOf(k)<0) types.push(k);
  });
  years.sort(); locs.sort(); types.sort();
  function grp(title, facet, vals, fmt){
    var h='<div class="tm-drop-grp"><div class="tm-drop-h">'+title+'</div>';
    vals.forEach(function(v){
      var active=(state.facet===facet && state.facetValue===v)?' active':'';
      h+='<button class="tm-drop-item'+active+'" data-facet="'+facet+'" data-v="'+escapeHtml(v)+'">'+escapeHtml(fmt(v))+'</button>';
    });
    return h+'</div>';
  }
  var allActive=(state.facet==='all'||!state.facetValue)?' active':'';
  var html='<button class="tm-drop-item'+allActive+'" data-facet="all" data-v="__all">'+(isZh?'全部':'All')+'</button>';
  html+=grp(isZh?'年份':'Year','year',years,function(v){return v;});
  html+=grp(isZh?'地点':'Location','location',locs,function(v){return v.split(',')[0].trim();});
  html+=grp(isZh?'类型':'Type','type',types,kindLabel);
  tmFilterMenu.innerHTML=html;
}
function applyFilter(facet, value){
  if(facet==='all'){ state.facet='all'; state.facetValue=null; }
  else { state.facet=facet; state.facetValue=value; }
  buildFilterMenu(); renderDyn(); renderAll();
}
document.getElementById('tmFilterBtn').addEventListener('click', function(e){ tmToggleDrop(tmFilterWrap, e); });
tmFilterMenu.addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  e.stopPropagation();
  applyFilter(b.getAttribute('data-facet'), b.getAttribute('data-v'));
  tmCloseAllDrops();
});
/* export dropdown */
document.getElementById('tmExportBtn').addEventListener('click', function(e){ tmToggleDrop(tmExportWrap, e); });
tmExportWrap.querySelector('.tm-drop-menu').addEventListener('click', function(e){
  var b=e.target.closest('button[data-act]'); if(!b) return;
  e.stopPropagation();
  if(b.getAttribute('data-act')==='pdf'){ window.print(); }
  tmCloseAllDrops();
});
document.addEventListener('click', tmCloseAllDrops);

/* By City card click → deep link to that city's talks (same target as View Details) */
document.getElementById('panel-wall').addEventListener('click', function(e){
  if(e.target.closest('a')) return; /* let buttons/links navigate themselves */
  var card = e.target.closest('.talkmap-city[data-href]');
  if(card){ window.location.href = card.getAttribute('data-href'); }
});

(function(){
  var saved = null;
  try { saved = localStorage.getItem('hq-talks-mode'); } catch(e){}
  buildFilterMenu();
  renderAll();
  renderDyn();
  /* deep-link: ?location=City, Country applies a Location filter and shows the Timeline */
  var params = new URLSearchParams(window.location.search);
  var locParam = params.get('location');
  if(locParam){
    var hit = talksData.filter(function(t){ return (t.city||'').toLowerCase().indexOf(String(locParam).toLowerCase()) >= 0; })[0];
    if(hit){
      state.facet = 'location';
      state.facetValue = hit.city;
      buildFilterMenu(); renderDyn();
      activate('journey');
      return;
    }
  }
  if(saved && seg.querySelector('button[data-mode="' + saved + '"]')){ activate(saved); }
  else { activate('journey'); }
})();

/* live re-render when the global language toggle flips data-lang on <html> */
(function(){
  function syncTalkLang(){
    isZh = (document.documentElement.getAttribute('data-lang') === 'zh');
    var s = document.getElementById('talkMapSearch');
    if(s){ s.placeholder = isZh ? '搜索演讲…' : 'Search talks…'; }
    buildFilterMenu();
    renderAll(); renderDyn();
    try { activate(activeMode); } catch(e){}
  }
  var _h = document.documentElement;
  if(window.MutationObserver){
    new MutationObserver(syncTalkLang).observe(_h, { attributes: true, attributeFilter: ['data-lang'] });
  }
})();
</script>
