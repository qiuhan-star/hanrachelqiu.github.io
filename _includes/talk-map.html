<!-- Self-contained Leaflet map of talk locations (HTTPS OSM tiles, no geocoding dependency) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  #talkMap { height: 520px; width: 100%; border-radius: 8px; margin: 0.5em 0 1.5em; z-index: 1; }
  .talkmap-pop h4 { margin: 0 0 0.4em; font-size: 1.05em; }
  .talkmap-pop ul { margin: 0.2em 0 0; padding-left: 1.15em; }
  .talkmap-pop li { margin-bottom: 0.7em; }
  .talkmap-pop .meta { color: #555; display: block; }
  .talkmap-pop .badge { color: #2a7f3e; font-weight: 600; }
  .talkmap-pop .award { color: #b8860b; font-weight: 600; }
</style>

{% if page.lang == 'zh-CN' %}
<h2>🗺️ 讲座地点地图</h2>
<p class="archive__item-excerpt">标记点显示我去过的城市/地区，点击可查看具体学校、会议与演讲标题。</p>
{% else %}
<h2>🗺️ Map of Talk Locations</h2>
<p class="archive__item-excerpt">Markers show the cities/regions I have visited for talks. Click a marker for the venue, conference, and talk title.</p>
{% endif %}

<div id="talkMap"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* talk locations data: one entry per talk. Talks are grouped by venue (school)
   below, so different schools in the same city — e.g. HKUST vs CUHK in Hong Kong —
   each get their own separate marker. Coords are hardcoded per venue, no geocoding. */
var talksData = [
  { city: "Xi'an, China", lat: 34.3416, lng: 108.9398, title: "Single vs. Multiple Agents: Types of Mobilization Entities Impact on the Length of Citizen Volunteer Service Participation", title_zh: "单主体 vs. 多主体：动员主体类型对公民志愿服务参与时长的影响", venue: "Xi'an Jiaotong University", conf: "Chinese Sociological Association 2026 Annual Conference", date: "2026-07-10", lang: "zh" },
  { city: "Xi'an, China", lat: 34.3416, lng: 108.9398, title: "Mobilized Giving and Voluntary Donation: Impact Mechanisms and the Moderating Role of Age", venue: "Xi'an Jiaotong University", conf: "Chinese Sociological Association 2026 Annual Conference", date: "2026-07-10", lang: "zh" },
  { city: "Perth, Australia", lat: -31.7455, lng: 115.7760, title: "Scenarios, Phases, or Operators: What Kind of Initiatives Succeed (or Fail) to Activate Citizens' Willingness to Co-Produce?", venue: "Edith Cowan University", conf: "IRSPM 2026 Conference", date: "2026-04-08" },
  { city: "Hong Kong, China", lat: 22.3366, lng: 114.2655, title: "Embracing Agile Governance: Cultivating Innovation and Addressing the Challenges of Generative Artificial Intelligence in Higher Education", venue: "HKUST", conf: "Journal of Asian Public Policy Special Issue Authors' Workshop", date: "2023-12-01" },
  { city: "Hong Kong, China", lat: 22.3366, lng: 114.2655, title: "Surging currents: A systematic review of the literature on dynamic stakeholder engagements in higher education in the GAI era", venue: "HKUST", conf: "Journal of Asian Public Policy Special Issue Authors' Workshop", date: "2023-12-01" },
  { city: "Shenyang, China", lat: 41.8057, lng: 123.4315, title: "Agile Governance for the Win: Adapting Higher Education to Generative Artificial Intelligence", venue: "Shenyang Normal University", conf: "Fucai Cup Digital Era Public Governance Innovation Academic Forum", date: "2023-12-03", award: "Outstanding Research Paper Award" },
  { city: "Shenyang, China", lat: 41.8057, lng: 123.4315, title: "Surging Currents: A Systematic Review of the Literature on Dynamic Stakeholder Engagements in Higher Education in the GAI Era", venue: "Shenyang Normal University", conf: "Fucai Cup Digital Era Public Governance Innovation Academic Forum", date: "2023-12-03", award: "Outstanding Research Paper Award" },
  { city: "Beijing, China", lat: 40.0007, lng: 116.3263, title: "Towards a Just Transition Future: A Quantitative Comparative Analysis of 30 Sub-national Governments in China (2010-2020)", venue: "Tsinghua University", conf: "International Conference on Comparative Public Policy", date: "2024-04-19" },
  { city: "Hong Kong, China", lat: 22.4197, lng: 114.2070, title: "Pathways to a Just Transition: Evidence from 30 Sub-national Governments in China", venue: "Chinese University of Hong Kong", conf: "20th Cross-Strait and Hong Kong-Macao Public Administration Academic Seminar", date: "2024-05-09" },
  { city: "Taiwan, China", lat: 25.0173, lng: 121.5400, title: "On-chain City Governance: How Can Blockchain in China Achieve Empowerment?", venue: "National Taiwan University", conf: "dg.o 2024 (Digital Government Research)", date: "2024-06-11" }
];

/* page language flag injected from Liquid: true on Chinese pages, false on English */
var isZh = {% if page.lang == 'zh-CN' %}true{% else %}false{% endif %};

/* group talks by venue (school/venue) so each school gets its own marker.
   Multiple talks at the same school share one marker. */
var byVenue = {};
for (var i = 0; i < talksData.length; i++) {
  var t = talksData[i];
  if (!byVenue[t.venue]) { byVenue[t.venue] = { lat: t.lat, lng: t.lng, city: t.city, items: [] }; }
  byVenue[t.venue].items.push(t);
}

var map = L.map('talkMap').setView([30, 114], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

/* collect marker positions. Frame the default view on the core East-Asia
   cluster (China / Hong Kong / Taiwan) where most talks are, so Hong Kong's
   two campuses clearly sit inside Hong Kong when the map opens. Perth is
   still plotted and reachable by zooming out. */
var coreLatLngs = [];
for (var venue in byVenue) {
  var v = byVenue[venue];
  var html = '<div class="talkmap-pop"><h4>' + venue + '</h4><p class="meta">' + v.city + '</p><ul>';
  for (var j = 0; j < v.items.length; j++) {
    var it = v.items[j];
    html += '<li><strong>' + it.title + '</strong>';
    if (it.title_zh) { html += '<br>（' + it.title_zh + '）'; }
    html += '<span class="meta">🏛️ ' + it.conf + '</span>';
    if (it.lang) { var langLabel = (it.lang === 'zh') ? (isZh ? '中文报告' : 'Presented in Chinese') : (isZh ? '英文报告' : 'Presented in English'); html += '<span class="badge">🗣️ ' + langLabel + '</span>'; }
    if (it.award) { html += '<span class="award">🏆 ' + it.award + '</span>'; }
    html += '<span class="meta">📅 ' + it.date + '</span>';
    html += '</li>';
  }
  html += '</ul></div>';
  L.marker([v.lat, v.lng]).addTo(map).bindPopup(html);
  if (v.city.indexOf('Perth') === -1) { coreLatLngs.push([v.lat, v.lng]); }
}

/* fit to the core cluster once layout is ready (size must be known) */
setTimeout(function() {
  map.invalidateSize();
  if (coreLatLngs.length) {
    map.fitBounds(coreLatLngs, { padding: [50, 50], maxZoom: 5 });
  }
}, 100);
</script>
