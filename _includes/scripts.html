<script>
/* Lift the site brand out of the greedy-nav <ul> and pin it to the far left of
   the header (directly above the sidebar avatar) BEFORE Minimal Mistakes'
   greedy-navigation measures the list — so the brand is never treated as a
   collapsible nav item. Runs once; guarded against PJAX re-runs.
   This keeps masthead.html (locked) untouched. */
(function () {
  var inner = document.querySelector('.masthead__inner-wrap');
  var nav = document.getElementById('site-nav');
  if (!nav) return;
  var vlinks = nav.querySelector('.visible-links');
  if (!vlinks) return;
  var brand = vlinks.querySelector('.masthead__menu-item--lg');
  if (brand && inner && !document.querySelector('.site-brand')) {
    var a = brand.querySelector('a');
    if (a) {
      var sb = document.createElement('a');
      sb.className = 'site-brand';
      sb.href = a.getAttribute('href') || '/';
      sb.innerHTML = a.innerHTML; /* keep bilingual EN/ZH spans */
      inner.insertBefore(sb, inner.firstChild);
    }
    brand.parentNode.removeChild(brand);
  }
  /* Capture original nav item order so we can restore it exactly afterwards. */
  var items = vlinks.querySelectorAll('li');
  for (var i = 0; i < items.length; i++) {
    items[i].setAttribute('data-nav-index', i);
  }
})();
</script>

<script>
(function () {
  var nav = document.getElementById('site-nav');
  if (!nav) return;
  var vlinks = nav.querySelector('.visible-links');
  var hlinks = nav.querySelector('.hidden-links');
  var btn = nav.querySelector('button');
  /* < 768px => mobile: restore a native hamburger menu.
     >= 768px => desktop/tablet: locked 方案 A full horizontal nav, no hamburger. */
  var MOBILE_MAX = 767;

  function sortedItems() {
    var items = Array.prototype.slice.call(vlinks.children);
    items.sort(function (a, b) {
      return (parseInt(a.getAttribute('data-nav-index'), 10) || 0) - (parseInt(b.getAttribute('data-nav-index'), 10) || 0);
    });
    return items;
  }

  function applyDesktop() {
    /* Move every nav item back into .visible-links in the locked original order,
       and suppress the greedy hamburger. (方案 A — desktop/tablet, unchanged.) */
    nav.classList.remove('is-open');
    var item;
    if (hlinks) { while ((item = hlinks.querySelector('li'))) vlinks.appendChild(item); }
    sortedItems().forEach(function (li) { vlinks.appendChild(li); });
    if (btn) btn.classList.add('hidden');
    if (hlinks) hlinks.classList.add('hidden');
  }

  function applyMobile() {
    /* Hand the menu to the hamburger: every remaining nav item
       ( Publications / Talks / Experience / CV ) moves into .hidden-links.
       The site brand is no longer in this list (lifted to the header's far
       left by the pre-greedy script), so it never appears in the dropdown. */
    nav.classList.remove('is-open');
    if (!vlinks || !hlinks) return;
    var kids = Array.prototype.slice.call(vlinks.children);
    kids.forEach(function (li) { hlinks.appendChild(li); });
    if (btn) btn.classList.remove('hidden');
  }

  function updateMastheadOffset() {
    var mh = document.querySelector('.masthead');
    if (!mh) return;
    var bottom = Math.round(mh.getBoundingClientRect().bottom);
    document.documentElement.style.setProperty('--masthead-bottom', bottom + 'px');
    /* Inline top/position forces a layout recalc in headless Chrome, ensuring
       the fixed dropdown is actually painted below the masthead on phones. */
    if (hlinks && window.innerWidth <= MOBILE_MAX) {
      hlinks.style.position = 'fixed';
      hlinks.style.top = bottom + 'px';
      hlinks.style.left = '0';
      hlinks.style.right = '0';
    }
  }

  function applyMode() {
    if (window.innerWidth <= MOBILE_MAX) applyMobile();
    else applyDesktop();
    updateMastheadOffset();
  }

  applyMode();
  window.addEventListener('resize', applyMode);

  /* Mobile hamburger toggle — our own handler, independent of MM's greedy
     logic (which does not reliably collapse .hidden-links in this build).
     The dropdown open/close is driven solely by the `is-open` class on <nav>. */
  if (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      nav.classList.toggle('is-open');
      if (window.innerWidth <= MOBILE_MAX) updateMastheadOffset();
    });
    document.addEventListener('click', function (e) {
      if (nav.classList.contains('is-open') && !nav.contains(e.target)) {
        nav.classList.remove('is-open');
      }
    });
    if (hlinks) {
      hlinks.addEventListener('click', function (e) {
        if (e.target.closest('a')) nav.classList.remove('is-open');
      });
    }
  }
})();
</script>
<style>
/* Neutralize Minimal Mistakes greedy-nav table layout so the locked
   4-core + More design does not overlap at narrower desktop widths.
   This only overrides CSS display values; it does NOT change
   masthead.html structure or any locked sizing tokens. */
.greedy-nav .visible-links {
  display: flex !important;
  align-items: center;
  flex-wrap: nowrap;
}
.greedy-nav .visible-links li {
  display: block;
  flex: 0 0 auto;
}
.greedy-nav .visible-links a {

}
.greedy-nav {
  display: flex;

  min-width: 0;
}
/* Site brand: lifted out of the greedy-nav list and pinned to the far-left of
   the header. On desktop it occupies the sidebar column (248 + 30 margin + 16
   gap = 294px) so it sits directly above the avatar and the nav aligns with the
   page content; on mobile it stays left-aligned beside the hamburger. */
.site-brand {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  font-weight: 700;
  font-size: 18px;
  line-height: 1.2;
  color: var(--masthead-text);

  white-space: nowrap;
}
.site-brand:hover {

}

  }

    flex: 0 0 294px;
    padding-left: 30px;
    padding-right: 16px;
    font-size: 17px;
  }
}
@media (max-width: 767px) {
  .site-brand {
    flex: 0 0 auto;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 16px;
    margin-right: 12px;
  }
  .masthead__menu {
    margin-left: 0 !important;
    flex: 0 0 auto;
  }
}
/* Tablet-landscape / narrow laptop (768-1023px): sidebar is hidden and space is
   tight, so shrink both brand and nav items to keep the full row from overlapping. */
@media (min-width: 768px) and (max-width: 1023px) {
  .site-brand {
    font-size: 15px;
    margin-right: 12px;
  }
  .masthead__menu-item a {
    font-size: 13px !important;
    padding-left: 0.4em !important;
    padding-right: 0.4em !important;
  }
  .nav-more-btn {
    font-size: 13px !important;
    padding-left: 0.4em !important;
    padding-right: 0.4em !important;
  }
}
/* The greedy dropdown (.hidden-links) is always collapsed by default.
   It only appears when the mobile hamburger adds .is-open (see media query
   below). This prevents the MM bug where the dropdown expands in normal flow. */
.greedy-nav .hidden-links {
  display: none !important;
}
/* Narrow-desktop / tablet-landscape (1024-1199px): tighten nav typography so the
   4 core items + More all fit comfortably. The left column is now owned by the
   lifted site brand (294px), so we no longer fight the margin here. */
@media (min-width: 1024px) and (max-width: 1199px) {
  .masthead__menu {
    margin-left: 0 !important;
  }
  .masthead__menu-item a {
    font-size: 14px !important;
    padding-left: 0.45em !important;
    padding-right: 0.45em !important;
    letter-spacing: -0.01em !important;
  }
  .nav-more-btn {
    font-size: 14px !important;
    padding-left: 0.45em !important;
    padding-right: 0.45em !important;
  }
  .site-brand {
    flex-basis: 250px;
    font-size: 15px;
    padding-left: 24px;
  }
}
/* Mobile (< 768px): native hamburger dropdown. Anchored to .masthead so it
   overlays content instead of pushing the top bar taller. */
@media (max-width: 767px) {
  .masthead {
    z-index: 100;
  }
  /* Let the dropdown position itself against .masthead (full-width) instead of
     the narrow .greedy-nav flex box, so the menu spans the whole viewport. */
  .greedy-nav .hidden-links {
    position: fixed !important;
    top: var(--masthead-bottom);
    left: 0;
    right: 0;
    flex-direction: column;
    background: var(--masthead-bg);
    border: 1px solid var(--masthead-border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 12px 30px rgba(20, 30, 50, 0.18);
    padding: 6px 0;
    z-index: 1000;
  }
  .greedy-nav.is-open .hidden-links {
    display: flex !important;
  }
  /* Make the hamburger a comfortable 40x40 tap target on phones. */
  /* On phones the inline nav list is replaced by the hamburger; hide the
     list itself (the site-title/home link inside it is duplicated elsewhere). */
  .greedy-nav .visible-links {
    display: none !important;
  }
  .greedy-nav button {
    position: static !important;
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    width: 40px !important;
    height: 40px !important;
    margin: 0 4px 0 0;
    padding: 0;
    background: transparent;
    border: 0;
    cursor: pointer;
  }
  .greedy-nav .hidden-links li {
    width: 100%;
    border-top: 1px solid var(--masthead-border);
  }
  .greedy-nav .hidden-links li:first-child {
    border-top: none;
  }
  .greedy-nav .hidden-links a {
    display: block;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    color: var(--masthead-text);
  }
  .greedy-nav .hidden-links a:hover {
    color: var(--masthead-hover);
  }
}
</style>
