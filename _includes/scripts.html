<script>
/* Capture original nav item order BEFORE Minimal Mistakes greedy-navigation
   mutates the DOM, so we can restore it exactly afterwards. */
(function () {
  var nav = document.getElementById('site-nav');
  if (!nav) return;
  var vlinks = nav.querySelector('.visible-links');
  if (!vlinks) return;
  var items = vlinks.querySelectorAll('li');
  for (var i = 0; i < items.length; i++) {
    items[i].setAttribute('data-nav-index', i);
  }
})();
</script>
<script src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
(function () {
  var nav = document.getElementById('site-nav');
  if (!nav) return;
  var vlinks = nav.querySelector('.visible-links');
  var hlinks = nav.querySelector('.hidden-links');
  var btn = nav.querySelector('button');
  function restoreNavItems() {
    var item;
    if (vlinks && hlinks) {
      while ((item = hlinks.querySelector('li'))) vlinks.appendChild(item);
    }
    /* Restore the original order captured before main.min.js ran. */
    if (vlinks) {
      var items = Array.prototype.slice.call(vlinks.children);
      items.sort(function (a, b) {
        return (parseInt(a.getAttribute('data-nav-index'), 10) || 0) - (parseInt(b.getAttribute('data-nav-index'), 10) || 0);
      });
      for (var i = 0; i < items.length; i++) vlinks.appendChild(items[i]);
    }
    if (btn) btn.classList.add('hidden');
    if (hlinks) hlinks.classList.add('hidden');
  }
  restoreNavItems();
  window.addEventListener('resize', restoreNavItems);
})();
</script>
<style>
/* Neutralize Minimal Mistakes greedy-nav table layout so the locked
   4-core + More design does not overlap at narrower desktop widths.
   This only overrides CSS display values; it does NOT change
   masthead.html structure or any locked sizing tokens. */
.greedy-nav .visible-links {
  display: flex !important;
  align-items: center;
  flex-wrap: nowrap;
}
.greedy-nav .visible-links li {
  display: block;
  flex: 0 0 auto;
}
.greedy-nav .visible-links a {
  white-space: nowrap;
}
.greedy-nav {
  display: flex;
  align-items: center;
  min-width: 0;
}
/* Narrow-desktop / tablet-landscape (1024-1199px): relax the left margin and
   tighten nav typography so the 4 core items + brand + More all fit on one
   row without overlapping. This is a responsive exception only for this width
   band; >=1200px keeps the locked 18px spec untouched. */
@media (min-width: 1024px) and (max-width: 1199px) {
  .masthead__menu {
    margin-left: 120px !important;
  }
  .masthead__menu-item a {
    font-size: 14px !important;
    padding-left: 0.45em !important;
    padding-right: 0.45em !important;
    letter-spacing: -0.01em !important;
  }
  .masthead__menu-item--lg a {
    font-size: 13px !important;
  }
  .nav-more-btn {
    font-size: 14px !important;
    padding-left: 0.45em !important;
    padding-right: 0.45em !important;
  }
}
</style>
